name: Codex translate recipes

on:
  push:
    branches:
      - codex/ricette-i18n-work

permissions:
  contents: write

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install translator
        run: pip install requests
      - name: Translate recipe names and procedures
        run: |
          python - <<'PY'
          import json, time, requests

          path = 'ricette_scoperta.json'
          with open(path, encoding='utf-8') as f:
              recipes = json.load(f)
          assert len(recipes) == 446, f'Expected 446 recipes, got {len(recipes)}'

          URL = 'https://translate.googleapis.com/translate_a/single'
          SEP = '\n<<<CODEX_STEP>>>\n'
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0'})

          def translate_one(text, lang):
              if not text:
                  return text
              params = {'client': 'gtx', 'sl': 'it', 'tl': lang, 'dt': 't', 'q': text}
              for attempt in range(8):
                  try:
                      r = session.get(URL, params=params, timeout=45)
                      r.raise_for_status()
                      data = r.json()
                      value = ''.join(part[0] for part in data[0] if part and part[0])
                      if value:
                          return value
                  except Exception as e:
                      print('retry-one', lang, attempt, repr(e))
                  time.sleep(min(3 * (attempt + 1), 20))
              raise RuntimeError(f'Translation failed: {lang}: {text[:120]}')

          def translate_texts(texts, lang):
              if not texts:
                  return []
              out = []
              chunk, chars = [], 0
              chunks = []
              for text in texts:
                  text = str(text)
                  extra = len(text) + len(SEP)
                  if chunk and chars + extra > 3000:
                      chunks.append(chunk)
                      chunk, chars = [], 0
                  chunk.append(text)
                  chars += extra
              if chunk:
                  chunks.append(chunk)

              for ci, chunk in enumerate(chunks):
                  packed = SEP.join(chunk)
                  translated = None
                  for attempt in range(8):
                      try:
                          params = {'client': 'gtx', 'sl': 'it', 'tl': lang, 'dt': 't', 'q': packed}
                          r = session.get(URL, params=params, timeout=60)
                          r.raise_for_status()
                          data = r.json()
                          translated = ''.join(part[0] for part in data[0] if part and part[0])
                          parts = translated.split(SEP) if translated else []
                          if len(parts) == len(chunk):
                              out.extend(parts)
                              print('ok', lang, ci + 1, '/', len(chunks), len(chunk), 'items')
                              break
                          print('bad-split', lang, ci, len(chunk), len(parts))
                      except Exception as e:
                          print('retry-pack', lang, ci, attempt, repr(e))
                      time.sleep(min(3 * (attempt + 1), 20))
                  else:
                      print('fallback-individual', lang, ci, len(chunk))
                      for text in chunk:
                          out.append(translate_one(text, lang))
                  time.sleep(0.5)
              assert len(out) == len(texts), (lang, len(out), len(texts))
              return out

          missing_en = [r for r in recipes if not r.get('procedimento_en')]
          en_steps = []
          for r in missing_en:
              en_steps.extend(r.get('procedimento_it') or [])
          en_trans = translate_texts(en_steps, 'en')
          pos = 0
          for r in missing_en:
              steps = r.get('procedimento_it') or []
              r['procedimento_en'] = en_trans[pos:pos + len(steps)]
              pos += len(steps)

          en_names = [r for r in missing_en if r.get('nome') == r.get('nome_it') or not r.get('nome')]
          translated_en_names = translate_texts([r.get('nome_it', '') for r in en_names], 'en')
          for r, v in zip(en_names, translated_en_names):
              r['nome_en'] = v
          for r in recipes:
              if 'nome_en' not in r:
                  r['nome_en'] = r.get('nome') or r.get('nome_it', '')

          for lang in ('fr', 'es', 'de'):
              name_key = f'nome_{lang}'
              proc_key = f'procedimento_{lang}'
              names = [r.get('nome_it') or r.get('nome') or '' for r in recipes]
              translated_names = translate_texts(names, lang)
              for r, v in zip(recipes, translated_names):
                  r[name_key] = v

              positions = []
              texts = []
              for idx, r in enumerate(recipes):
                  steps = r.get('procedimento_it') or []
                  positions.append((idx, len(steps)))
                  texts.extend(steps)
              translated_steps = translate_texts(texts, lang)
              pos = 0
              for idx, n in positions:
                  recipes[idx][proc_key] = translated_steps[pos:pos + n]
                  pos += n

          with open(path, 'w', encoding='utf-8') as f:
              json.dump(recipes, f, ensure_ascii=False, indent=2)
              f.write('\n')

          print('DONE', len(recipes), 'recipes')
          for lang in ('en', 'fr', 'es', 'de'):
              print(lang, 'names', sum(bool(r.get('nome_' + lang)) for r in recipes),
                    'procedures', sum(bool(r.get('procedimento_' + lang)) for r in recipes))
          PY
      - name: Validate JSON and counts
        run: |
          python - <<'PY'
          import json
          with open('ricette_scoperta.json', encoding='utf-8') as f:
              r = json.load(f)
          assert len(r) == 446
          assert len({x['id'] for x in r}) == 446
          for x in r:
              assert x.get('nome_it')
              assert x.get('procedimento_it')
              for lang in ('en', 'fr', 'es', 'de'):
                  assert x.get('nome_' + lang), (x['id'], 'nome_' + lang)
                  assert x.get('procedimento_' + lang), (x['id'], 'procedimento_' + lang)
                  assert len(x['procedimento_' + lang]) == len(x['procedimento_it']), (x['id'], lang)
          print('VALID 446/446 with names + procedures in IT/EN/FR/ES/DE')
          PY
      - name: Commit translations
        run: |
          git config user.name "Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ricette_scoperta.json
          git commit -m "i18n(codex): completa traduzione delle 446 ricette" || exit 0
          git push
